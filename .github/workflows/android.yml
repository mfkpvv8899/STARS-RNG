name: Gerar APK STAR RNG

on:
  workflow_dispatch:
  push:
    branches: [principal] # Verifique se a sua branch é "principal" ou "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Opcional: acelera builds futuros

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências do Node
        run: npm install

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar com o Capacitor
        run: npx cap sync android

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: STAR-RNG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
