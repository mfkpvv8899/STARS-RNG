<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star RNG</title>
<style>
:root{color-scheme:dark;--bg:#07071a;--panel:#11112b;--line:#25254d;--tx:#eceaff;--mut:#8d8bb8;--acc:#ffd166;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07071a;--panel:#11112b;--line:#25254d;--tx:#eceaff;--mut:#8d8bb8}}
:root[data-theme="dark"]{--bg:#07071a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#1a1646,var(--bg) 60%) fixed;color:var(--tx);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:30px;letter-spacing:.5px;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 14px;font-size:14px}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}
.star{width:150px;height:150px;margin:0 auto;display:block;transition:filter .3s}
.star.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.star.pop{animation:none}}
.rname{font-size:26px;font-weight:800;margin:6px 0 0}
.rodds{color:var(--mut);font-size:14px;min-height:20px}
button{font:inherit;cursor:pointer;color:var(--tx)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.roll{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#2a1d00;font-size:20px;font-weight:800}
.roll:active{transform:scale(.98)}.roll:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:8px;margin-top:10px}
.up{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:14px;text-align:left}
.up:disabled{opacity:.45;cursor:not-allowed}
.up b{display:block;font-size:15px}
h2{font-size:18px;margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.cell svg{width:38px;height:38px;flex:none}
.cell small{color:var(--mut);display:block;font-size:12px}
.cell.lock{opacity:.5}
.grp{margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 10px}.grp summary{cursor:pointer;padding:8px 0;font-size:16px;font-weight:700;display:flex;justify-content:space-between}.grp summary span{color:var(--mut);font-weight:400;font-size:13px}.grp .grid{padding-bottom:10px}.bnav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}.bnav button{width:70px;height:70px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bnav button i{font-style:normal;font-size:24px}.bnav button.on{background:var(--acc);color:#2a1d00;border-color:var(--acc)}.grp h3{margin:8px 0 6px;font-size:16px;display:flex;justify-content:space-between}.grp h3 span{color:var(--mut);font-weight:400;font-size:13px}main{padding-bottom:120px!important}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}.tabs button.on{background:var(--acc);color:#2a1d00;border-color:var(--acc)}.nick{display:flex;gap:8px;margin-bottom:12px}.nick input{flex:1;min-width:0;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit}.nick button{padding:10px 16px;border-radius:12px;border:0;background:var(--acc);color:#2a1d00;font-weight:800}.rk{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:6px}.rk.me{border-color:var(--acc)}.rk .pos{width:32px;font-size:18px;font-weight:800;text-align:center;flex:none}.rk b{display:block;overflow-wrap:anywhere}.rk small{color:var(--mut)}.msg{color:var(--mut);text-align:center;padding:16px}[hidden]{display:none!important}.ci{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;overflow-wrap:anywhere}.ci.roll{background:#1b1740}.ci small{color:var(--mut);margin-left:4px}#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--acc);color:#2a1d00;font-weight:800;padding:10px 16px;border-radius:999px;max-width:92vw;text-align:center}body{overflow-x:hidden}#fx{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;animation:fxio var(--dur) linear forwards}@keyframes fxio{0%{opacity:0}4%{opacity:1}90%{opacity:1}100%{opacity:0}}#fx .g{position:absolute;inset:0;box-shadow:inset 0 0 calc(40px + var(--t)*35px) calc(var(--t)*4px) var(--c);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 30%,transparent),transparent 65%);animation:gp calc(1.6s - var(--t)*.15s) ease-in-out infinite}@keyframes gp{50%{opacity:.45}}#fx .g.rb{animation:gp 1s ease-in-out infinite,hue 2s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}#fx .rays{position:absolute;left:50%;top:40%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 55%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000,transparent 50%);mask:radial-gradient(circle,#000,transparent 50%);animation:spin calc(14s - var(--t)*1.5s) linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#fx .fire{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to top,#ff3b1fcc,#ff9f43aa 40%,transparent);transform-origin:bottom;animation:fl .35s ease-in-out infinite alternate}@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}#fx .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ff00aa33 0 3px,#00ffe133 3px 6px,transparent 6px 14px);mix-blend-mode:screen;animation:gl .25s steps(2) infinite}@keyframes gl{0%{transform:translate(-6px,0);opacity:.9}50%{transform:translate(8px,3px);opacity:.3}100%{transform:translate(-3px,-4px);opacity:.8}}#fx .flash{position:absolute;inset:0;background:#fff;animation:fa 1.5s ease-out forwards}@keyframes fa{from{opacity:.95}to{opacity:0}}#fx .p{position:absolute;color:var(--c);text-shadow:0 0 8px var(--c);animation-duration:var(--d);animation-iteration-count:infinite;animation-timing-function:linear}#fx .p.up{bottom:-40px;animation-name:up}#fx .p.dn{top:-40px;animation-name:dn}@keyframes up{to{transform:translateY(-110vh) rotate(180deg)}}@keyframes dn{to{transform:translateY(110vh) rotate(200deg)}}html.gs{filter:grayscale(1) contrast(1.1)}#fx .edge{position:absolute;inset:0;border:10px solid #ff1a1a;box-shadow:inset 0 0 70px 24px #ff1a1a;animation:ep .35s ease-in-out infinite alternate}@keyframes ep{from{opacity:.6}to{opacity:1}}#fx .white{position:absolute;inset:0;background:#fff;opacity:.95}#fx .dim{position:absolute;inset:0;background:rgba(0,0,12,.6)}#fx .bh{position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;border-radius:50%;background:radial-gradient(circle,#000 0 32%,#3df0ffcc 38%,#7a3cffaa 48%,transparent 68%);animation:bhA var(--dur) ease-in-out forwards}@keyframes bhA{0%{transform:scale(0) rotate(0)}35%{transform:scale(1) rotate(180deg)}70%{transform:scale(1.15) rotate(420deg)}100%{transform:scale(0) rotate(720deg)}}#fx .blue{position:absolute;inset:0;background:radial-gradient(circle,#2f6bff,#0a1f7a 70%)}#fx .sword{position:absolute;left:50%;top:50%;width:min(16vmin,100px);filter:drop-shadow(0 0 18px #9fd0ff);animation:sw var(--dur) ease-out forwards}@keyframes sw{0%{transform:translate(-50%,-160%) scale(.8);opacity:0}30%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:1}}#fx .blink{position:absolute;inset:0;background:#000;animation:bk .5s steps(1) infinite}@keyframes bk{0%{background:#000}50%{background:#e00000}}#fx .black{position:absolute;inset:0;background:#000}#fx .wing{position:absolute;left:50%;top:50%;width:min(92vw,560px);transform:translate(-50%,-50%);animation:wg var(--dur) ease-in-out forwards}@keyframes wg{0%,18%{opacity:0;transform:translate(-50%,-45%) scale(.7)}38%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 10px #fff)}70%{opacity:1;filter:drop-shadow(0 0 40px #fff6c8)}100%{opacity:1;filter:drop-shadow(0 0 80px #fff)}}#fx .glow{position:absolute;inset:0;background:#fff;opacity:0;animation:gw var(--dur) ease-in forwards}@keyframes gw{0%,62%{opacity:0}85%,100%{opacity:1}}main.shake{animation:shk var(--sp) linear infinite}@keyframes shk{0%{transform:translate(0,0)}20%{transform:translate(calc(var(--a)*-1),calc(var(--a)*.5))}40%{transform:translate(var(--a),calc(var(--a)*-.7))}60%{transform:translate(calc(var(--a)*-.6),calc(var(--a)*-.5))}80%{transform:translate(calc(var(--a)*.8),calc(var(--a)*.6))}100%{transform:translate(0,0)}}@media (prefers-reduced-motion:reduce){main.shake{animation:none}#fx .p,#fx .rays,#fx .blink,#fx .edge{animation:none}}.reset{margin:18px auto 0;display:block;background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px}
.glitch{background:linear-gradient(90deg,#f66,#fd6,#6f9,#6cf,#c6f,#f66);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<main>
<h1>⭐ Star RNG</h1>
<p class="sub">Gire estrelas e ache as mais raras do universo.</p>
<div class="bar"><div class="chip">Giros: <b id="rolls">0</b></div><div class="chip">Coleção: <b id="prog">0/130</b></div></div>

<div id="vPlay"><section class="stage" aria-live="polite">
<svg class="star" id="star" viewBox="0 0 100 100"><polygon id="poly" points="50,5 61,38 96,38 68,59 79,92 50,72 21,92 32,59 4,38 39,38" fill="#555"/></svg>
<div class="rname" id="rname">Pronto?</div>
<div class="rodds" id="rodds">Toque em girar</div>
<button class="roll" id="roll">Girar estrela</button>
<button class="up" id="upA" style="width:100%;margin-top:10px;text-align:center"></button>
</section>


</div><div id="vColl" hidden><h2>Coleção</h2><div id="grid"></div>
<button class="reset" id="reset">Apagar progresso</button></div>
<div id="vChat" hidden><div class="nick"><input id="cin" maxlength="140" placeholder="Escreva para todos" aria-label="Mensagem"><button id="csend">Enviar</button></div><div id="clist"><div class="msg">Carregando chat...</div></div><p class="sub">Aqui aparece quem tirou Mítico ou mais raro.</p></div>
<div id="vRank" hidden><div class="nick"><input id="nick" maxlength="16" aria-label="Seu apelido" placeholder="Seu apelido"><button id="saveNick">Salvar</button></div><div class="msg" id="rstat" hidden></div><div id="rlist"><div class="msg">Carregando ranking...</div></div><p class="sub">Ordem: estrela mais rara, depois quantas você achou.</p></div>
</main>
<div id="fx" hidden></div><div id="toast" hidden></div>
<nav class="bnav"><button id="tPlay" class="on"><i>⭐</i>Jogar</button><button id="tColl"><i>📖</i>Coleção</button><button id="tRank"><i>🏆</i>Ranking</button><button id="tChat"><i>💬</i>Chat</button></nav>
<script>
const NICE=x=>{const m=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.round(x/m)*m};
const T=[["Comum","#b8bcc6",0,0],["Incomum","#6fdc8c",12,45],["Raro","#4da3ff",60,250],["Épico","#b266ff",300,1200],["Lenda","#ff9f43",1500,6000],["Lendario","#ffd32a",8000,35000],["Mítico","#ff4d9d",5e4,2.5e5],["Divine","#fff2b3",4e5,2e6],["Cosmic","#3df0ff",3e6,1.5e7],["Secreto","glitch",2.5e7,1.2e8],["Eternal","#9d7bff",2e8,1e9],["Inferno","#ff3b1f",1.5e9,8e9],["Angelic","#ffffff",1e10,6e10]];
const R=T.map(([n,c,lo,hi])=>({n,c,o:Array.from({length:10},(_,j)=>lo?NICE(lo*Math.pow(hi/lo,j/9)):j+1)}));
const ALL=[];R.forEach((r,i)=>r.o.forEach((o,j)=>ALL.push({i,j,o})));
const SORT=[...ALL].sort((a,b)=>b.o-a.o);
const K="starrng_v4";
let S={rolls:0,have:{},name:""};
try{const x=JSON.parse(localStorage.getItem(K)||"null");if(x)S=Object.assign(S,x)}catch(e){}
if(!S.name)S.name="Jogador"+Math.floor(100+Math.random()*900);
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const fo=o=>o>=1e9?(o/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1})+" bi":o>=1e6?(o/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi":o.toLocaleString("pt-BR");
const col=r=>r.c==="glitch"?"#f6c":r.c;
function pts(j){const k=5+j,ir=.55-j*.02;let p=[];
for(let q=0;q<k*2;q++){const rad=q%2?46*ir:46,an=Math.PI*q/k-Math.PI/2;p.push((50+rad*Math.cos(an)).toFixed(1)+","+(52+rad*Math.sin(an)).toFixed(1))}
return p.join(" ")}
const starSVG=(i,j,l)=>`<svg viewBox="0 0 100 100"><polygon points="${pts(j)}" fill="${l?"#2b2b4a":col(R[i])}"/></svg>`;
function pick(){for(const s of SORT){if(Math.random()<1/s.o)return s}return ALL[0]}
function stats(){let best=0,bi=0,f=0;for(const k in S.have){f++;const [i,j]=k.split("-").map(Number),o=R[i].o[j];if(o>best){best=o;bi=i}}return{best,bi,f}}
const FB={apiKey:"AIzaSyB-_8NlrYUXpdwrccRwd7XIWAgW-HHCnfQ",authDomain:"star-rng.firebaseapp.com",projectId:"star-rng",storageBucket:"star-rng.firebasestorage.app",messagingSenderId:"944218648695",appId:"1:944218648695:web:e250b8a85eef3add951672"};
function getUid(){let u='';try{u=localStorage.getItem('starrng_uid')||''}catch(e){}if(!u){u='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('starrng_uid',u)}catch(e){}}return u}
async function initFB(){const B='https://www.gstatic.com/firebasejs/10.12.2/';
const [A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);
const fs=F.getFirestore(A.initializeApp(FB));
return{doc:p=>({set:d=>F.setDoc(F.doc(fs,...p.split('/')),d)}),
collection:p=>{const c=F.collection(fs,p);return{onSnapshot:(n,e)=>F.onSnapshot(c,n,e),add:d=>F.addDoc(c,d),
orderBy:(f,d)=>({limit:k=>({onSnapshot:(n,e)=>F.onSnapshot(F.query(c,F.orderBy(f,d),F.limit(k)),n,e)})})}}}}
// ranking
let db=null,uid=null,players=null,dirty=false,wt=null,failed=false;
function sync(){if(!db||!uid)return;dirty=false;const t=stats();
db.doc("players/"+uid).set({name:S.name,rolls:S.rolls,found:t.f,best:t.best,bestR:t.bi,t:Date.now()}).then(()=>{wErr=false;rstat()}).catch(()=>{wErr=true;rstat()})}
function queue(){dirty=true;if(!wt)wt=setTimeout(()=>{wt=null;if(dirty)sync()},3000)}
function renderRank(){const box=$("rlist");box.textContent="";
const msg=t=>{const d=document.createElement("div");d.className="msg";d.textContent=t;box.appendChild(d)};
if(!db||!uid){msg(failed?"Ranking indisponível. Verifique sua internet.":"Carregando ranking...");return}
if(!players){msg("Carregando ranking...");return}
if(!players.length){msg("Ninguém no ranking ainda. Gire uma estrela!");return}
const L=[...players].sort((a,b)=>(b.best||0)-(a.best||0)||(b.found||0)-(a.found||0)||(a.rolls||0)-(b.rolls||0)).slice(0,50);
L.forEach((p,n)=>{const r=document.createElement("div");r.className="rk"+(p.id===uid?" me":"");
const pos=document.createElement("div");pos.className="pos";pos.textContent=n<3?["🥇","🥈","🥉"][n]:n+1;
const w=document.createElement("div"),b=document.createElement("b"),sm=document.createElement("small");
b.textContent=(p.name||"Jogador")+(p.id===uid?" (você)":"");
const rr=R[p.bestR];sm.textContent=p.best?`${rr?rr.n:""} 1 em ${fo(p.best)} · ${p.found}/130 estrelas · ${p.rolls} giros`:"Ainda sem estrelas";
if(rr&&p.best&&rr.c!=="glitch")b.style.color=col(rr);
w.append(b,sm);r.append(pos,w);box.appendChild(r)})}
(async()=>{try{db=await initFB();uid=getUid();
if(db&&uid){setTimeout(()=>{if(!players){failed=true;renderRank()}},10000);
db.collection("players").onSnapshot(sn=>{players=sn.docs.map(d=>Object.assign({id:d.id},d.data()));renderRank()},()=>{failed=true;renderRank()});feedSub();sync()}else failed=true}catch(e){failed=true}renderRank();if(failed)renderFeed(null)})();
// jogo
const open=new Set();
const FX={6:{d:1,k:'edge'},7:{d:3,k:'white',c:'#ffc233',pt:'✦',up:1},8:{d:3,k:'bh'},9:{d:3,k:'gray'},10:{d:4,k:'sword'},11:{d:4,k:'blink'},12:{d:5,k:'angel'}};
const SWORD='<svg viewBox="0 0 60 200"><path d="M30 0L40 22V132H20V22Z" fill="#dff0ff" stroke="#9fd0ff"/><path d="M30 8V128" stroke="#8fb8ff" stroke-width="2"/><rect x="4" y="132" width="52" height="10" rx="4" fill="#ffd166"/><rect x="26" y="142" width="8" height="36" fill="#7a4a1a"/><circle cx="30" cy="186" r="8" fill="#ffd166"/></svg>';
function WING(){let g='';
for(const [n,l0,dl,a0,da,fill] of [[10,62,7,6,11,'#fff'],[10,44,5,10,11,'#f1f7ff'],[8,26,3.5,14,13,'#e2efff']])for(let k=0;k<n;k++){const L=l0+k*dl,a=a0+k*da;g+=`<path fill="${fill}" transform="rotate(${a})" d="M0 0C9 ${-L*.3} 11 ${-L*.7} 0 ${-L}C-11 ${-L*.7} -9 ${-L*.3} 0 0Z"/><path fill="none" transform="rotate(${a})" d="M0 -4L0 ${-L*.85}"/>`}
return '<svg viewBox="-150 -90 300 150"><g stroke="#b9cfe8" stroke-width="1.2"><g transform="translate(8 0)">'+g+'</g><g transform="scale(-1 1) translate(8 0)">'+g+'</g></g></svg>'}
let fxT=null,fxCur=0;
const H=document.documentElement;
function fxEnd(){const o=$('fx');fxT=null;fxCur=0;o.hidden=true;o.textContent='';document.querySelector('main').classList.remove('shake');H.classList.remove('gs')}
function fx(i){const f=FX[i];if(!f||(fxT&&i<fxCur))return;
const t=i-5,o=$('fx'),m=document.querySelector('main');
clearTimeout(fxT);o.textContent='';m.classList.remove('shake');H.classList.remove('gs');void m.offsetWidth;
o.hidden=true;void o.offsetWidth;o.hidden=false;
o.style.setProperty('--c',f.c||'#ffd166');o.style.setProperty('--t',t);o.style.setProperty('--dur',f.d+'s');
const add=(cls,tx)=>{const d=document.createElement('div');d.className=cls;if(tx)d.textContent=tx;o.appendChild(d);return d};
if(f.k==='edge')add('edge');
if(f.k==='white'){add('white');add('rays')}
if(f.k==='bh'){add('dim');add('bh')}
if(f.k==='gray')H.classList.add('gs');
if(f.k==='sword'){add('blue');add('sword').innerHTML=SWORD}
if(f.k==='blink')add('blink');
if(f.k==='angel'){add('black');add('wing').innerHTML=WING();add('glow')}
if(f.pt)for(let k=0;k<30;k++){const p=add('p '+(f.up?'up':'dn'),f.pt);p.style.cssText=`left:${Math.random()*100}%;--d:${2+Math.random()*3}s;animation-delay:-${Math.random()*3}s;font-size:${14+Math.random()*16}px`}
m.style.setProperty('--a',(3+t*2)+'px');m.style.setProperty('--sp',(.45-t*.04)+'s');m.classList.add('shake');
fxCur=i;fxT=setTimeout(fxEnd,f.d*1000)}
let wErr=false,lastMsg=0;
function rstat(){const e=$('rstat');e.hidden=!wErr;e.textContent='Não foi possível salvar sua pontuação. Verifique sua internet.'}
function post(d){if(!db||!uid)return;db.collection('feed').add(Object.assign({uid,name:S.name,t:Date.now()},d)).catch(()=>{})}
function toast(tx){const e=$('toast');e.textContent=tx;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=true},4000)}
function feedSub(){let first=true;
db.collection('feed').orderBy('t','desc').limit(60).onSnapshot(sn=>{
if(!first)sn.docChanges().forEach(c=>{if(c.type==='added'){const x=c.doc.data();if(x.type==='roll'&&x.uid!==uid&&R[x.r])toast('🔔 '+x.name+' tirou '+R[x.r].n+'!')}});
first=false;renderFeed(sn.docs.map(d=>d.data()))},()=>renderFeed(null))}
function renderFeed(L){const box=$('clist');box.textContent='';
const msg=t=>{const d=document.createElement('div');d.className='msg';d.textContent=t;box.appendChild(d)};
if(!L){msg('Chat indisponível. Verifique sua internet.');return}
if(!L.length){msg('Nada por aqui ainda. Seja o primeiro!');return}
L.forEach(x=>{const r=document.createElement('div');r.className='ci'+(x.type==='roll'?' roll':'');
const b=document.createElement('b'),tx=document.createElement('span'),sm=document.createElement('small');
sm.textContent=new Date(x.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
if(x.type==='roll'&&R[x.r]){const q=R[x.r];b.textContent='⭐ '+(x.name||'Jogador');tx.textContent=' tirou '+q.n+' (1 em '+fo(x.o)+')!';r.style.borderColor=col(q)}
else{b.textContent=(x.name||'Jogador')+': ';tx.textContent=x.text||''}
r.append(b,tx,document.createTextNode(' '),sm);box.appendChild(r)})}
function send(){const v=$('cin').value.trim().slice(0,140);if(!v||Date.now()-lastMsg<1500)return;lastMsg=Date.now();$('cin').value='';post({type:'msg',text:v})}
$('csend').onclick=send;$('cin').onkeydown=e=>{if(e.key==='Enter')send()};
function doRoll(){
const s=pick(),r=R[s.i];S.rolls++;const k=s.i+"-"+s.j;S.have[k]=(S.have[k]||0)+1;
const p=$("poly");p.setAttribute("points",pts(s.j));p.setAttribute("fill",col(r));
const st=$("star");st.style.filter=`drop-shadow(0 0 ${8+s.i*3}px ${col(r)})`;
st.classList.remove("pop");void st.getBoundingClientRect();st.classList.add("pop");
const nm=$("rname");nm.textContent=r.n;nm.className="rname"+(r.c==="glitch"?" glitch":"");
nm.style.color=r.c==="glitch"?"":col(r);
$("rodds").textContent="1 em "+fo(s.o).replace(/^/,"");
save();ui();queue();fx(s.i);if(s.i>=6)post({type:'roll',r:s.i,o:s.o})}
function ui(){
$("rolls").textContent=S.rolls;
$("upA").textContent=running?"Parar auto-giro":"Ligar auto-giro";
let g="",n=0;
R.forEach((r,i)=>{const gl=r.c==="glitch";let cnt=0,cells="";
r.o.forEach((o,j)=>{const c=S.have[i+"-"+j]||0;if(c){n++;cnt++}
cells+=`<div class="cell ${c?"":"lock"}">${starSVG(i,j,!c)}<div><b>${c?r.n:"???"}</b><small>1 em ${fo(o)}${c?" · x"+c:""}</small></div></div>`});
g+=`<div class="grp"><h3 class="${gl?"glitch":""}" ${gl?"":`style="color:${r.c}"`}>${r.n}<span>${cnt}/10</span></h3><div class="grid">${cells}</div></div>`});
$("grid").innerHTML=g;$("prog").textContent=n+"/"+ALL.length}
let running=false,timer=null;
function loop(){if(!running)return;doRoll();timer=setTimeout(loop,400)}
let cd=false;
$("roll").onclick=()=>{if(running||cd)return;cd=true;$("roll").disabled=true;doRoll();setTimeout(()=>{cd=false;$("roll").disabled=false},400)};
$("upA").onclick=()=>{running=!running;clearTimeout(timer);if(running)loop();ui()};
$("reset").onclick=()=>{if(confirm("Apagar todo o progresso?")){running=false;clearTimeout(timer);try{localStorage.removeItem(K)}catch(e){}S={rolls:0,have:{},name:S.name};save();$("rname").textContent="Pronto?";$("rname").style.color="";$("rodds").textContent="Toque em girar";ui();sync()}};
$("nick").value=S.name;
$("saveNick").onclick=()=>{const v=$("nick").value.trim().slice(0,16);if(!v)return;S.name=v;save();sync()};
const V=["vPlay","vColl","vRank","vChat"],B=["tPlay","tColl","tRank","tChat"];
function tab(n){V.forEach((v,i)=>{$(v).hidden=i!==n;$(B[i]).classList.toggle("on",i===n)})}
B.forEach((b,i)=>$(b).onclick=()=>tab(i));
ui();
</script>
</body>
</html>
